[project]
name = "ims-api"
version = "0.1.0"
description = "Updaate Computers IMS - FastAPI business backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "cryptography>=42",
  "tzdata>=2024.1",
  "httpx>=0.27,<1",
  "phonenumbers>=9,<10",
  "reportlab[shaping]>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pgserver>=0.1.4", "pypdf>=5,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.setuptools.packages.find]
include = ["app*"]
